name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: motionmain/motormetric

jobs:
  publish:
    name: Build and publish
    if: github.actor == 'MotionMAIN'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version tag such as v0.0.1."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull latest image and recreate Mittwald service
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
          MITTWALD_STACK_ID: ${{ vars.STACK_ID }}
        shell: bash
        run: |
          set -euo pipefail

          : "${MITTWALD_API_TOKEN:?MITTWALD_API_TOKEN secret is required}"
          : "${MITTWALD_STACK_ID:?STACK_ID variable is required}"

          api_base="https://api.mittwald.de/v2"
          image="${REGISTRY}/${IMAGE_NAME}:latest"
          stack="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer ${MITTWALD_API_TOKEN}" \
              "${api_base}/stacks/${MITTWALD_STACK_ID}/"
          )"
          service_ids="$(
            jq --compact-output --arg image "${image}" '[
              .services[]
              | select((.pendingState.image // .deployedState.image) == $image)
              | .id
            ]' <<<"${stack}"
          )"
          service_count="$(jq 'length' <<<"${service_ids}")"

          if [[ ${service_count} -ne 1 ]]; then
            echo "Expected exactly one Mittwald service using ${image}, found ${service_count}."
            exit 1
          fi

          service_id="$(jq --raw-output '.[0]' <<<"${service_ids}")"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Authorization: Bearer ${MITTWALD_API_TOKEN}" \
            "${api_base}/stacks/${MITTWALD_STACK_ID}/services/${service_id}/actions/pull/"
